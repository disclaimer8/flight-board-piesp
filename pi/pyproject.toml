[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-board-piesp"
version = "0.1.0"
description = "Flight board for Raspberry Pi Zero W + HUB75 64x128 LED matrix"
readme = "README.md"
# Pi Zero W 1.1 is armv6l; 3.9 is the realistic floor for the Raspberry Pi OS
# wheels available for that arch.
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "pillow>=9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# rgbmatrix is NOT here: it is built from source on the Pi only, via
# scripts/install.sh. Keeping it out lets CI install deps on a host with no
# panel.
dev = [
    "pytest>=7.0",
    "responses>=0.23",
    "ruff>=0.4",
]

[project.scripts]
flight-board = "flight_board.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
