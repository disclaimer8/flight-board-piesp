<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100">
  <style>
    .bg { fill: #fff; }
    .title { font: 700 31px Arial, sans-serif; fill: #111827; }
    .sub { font: 17px Arial, sans-serif; fill: #374151; }
    .label { font: 700 16px Arial, sans-serif; fill: #111827; }
    .small { font: 13px Arial, sans-serif; fill: #374151; }
    .tiny { font: 11px Arial, sans-serif; fill: #374151; }
    .pin { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.4; }
    .unused { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.1; }
    .hot { fill: #fff7ed; stroke: #ea580c; stroke-width: 3; }
    .addr { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 3; }
    .r { fill: #fee2e2; stroke: #dc2626; stroke-width: 3; }
    .g { fill: #dcfce7; stroke: #16a34a; stroke-width: 3; }
    .b { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
    .gnd { fill: #e5e7eb; stroke: #111827; stroke-width: 3; }
    .pwr { fill: #fee2e2; stroke: #991b1b; stroke-width: 2; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 10; }
    .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
    .wire { fill: none; stroke-width: 3.8; opacity: 0.92; }
    .orange { stroke: #ea580c; }
    .purple { stroke: #7c3aed; }
    .red { stroke: #dc2626; }
    .green { stroke: #16a34a; }
    .blue { stroke: #2563eb; }
    .gray { stroke: #374151; stroke-dasharray: 8 5; }
  </style>

  <rect class="bg" width="1500" height="1100"/>
  <text x="42" y="50" class="title">Direct Raspberry Pi -> HUB75 check map, all pins shown</text>
  <text x="42" y="80" class="sub">For direct wiring use hardware_mapping: "regular". Count physical pins exactly as shown.</text>

  <rect x="42" y="115" width="530" height="870" class="box"/>
  <text x="70" y="150" class="label">Raspberry Pi 40-pin header, physical pins</text>
  <text x="70" y="174" class="small">Odd pins are one side, even pins are the other side. Pin 1 is the corner marker.</text>
  <circle cx="84" cy="207" r="9" fill="#ef4444"/>
  <text x="100" y="212" class="small">pin 1 marker</text>
  <text x="105" y="245" class="small">odd side</text>
  <text x="330" y="245" class="small">even side</text>

  <rect x="1010" y="145" width="405" height="650" class="box"/>
  <text x="1038" y="180" class="label">HUB75 input connector, all pins</text>
  <text x="1038" y="204" class="small">2x8 IDC. Pin 1 is usually arrow/triangle or red-stripe side.</text>
  <rect x="1040" y="222" width="160" height="13" fill="#dc2626"/>
  <text x="1210" y="234" class="small">red stripe / pin 1 side</text>
  <text x="1095" y="270" class="small">left column</text>
  <text x="1238" y="270" class="small">right column</text>

  <rect x="620" y="875" width="810" height="125" class="warn"/>
  <text x="645" y="910" class="label">Power warning</text>
  <text x="645" y="938" class="small">Do not power the LED panel from Raspberry Pi 5V. Panel gets separate 5V PSU.</text>
  <text x="645" y="966" class="small">Panel PSU GND and Raspberry Pi GND must be connected together. Use HUB75 pins 4 and 16 to Pi GND.</text>

  <!-- Raspberry Pi full 40-pin table. Coordinates: odd x=110, even x=330, y=270+row*34 -->
  <g id="pi" transform="translate(110,270)">
    <!-- row 1 -->
    <circle class="unused" cx="0" cy="0" r="13"/><text x="-42" y="5" class="tiny">1  3V3</text>
    <circle class="pwr" cx="220" cy="0" r="13"/><text x="240" y="5" class="tiny">2  5V, do not use for panel</text>
    <!-- row 2 -->
    <circle class="unused" cx="0" cy="34" r="13"/><text x="-70" y="39" class="tiny">3  GPIO2</text>
    <circle class="pwr" cx="220" cy="34" r="13"/><text x="240" y="39" class="tiny">4  5V, do not use for panel</text>
    <!-- row 3 -->
    <circle class="unused" cx="0" cy="68" r="13"/><text x="-70" y="73" class="tiny">5  GPIO3</text>
    <circle class="gnd" cx="220" cy="68" r="13"/><text x="240" y="73" class="tiny">6  GND -> HUB75 4</text>
    <!-- row 4 -->
    <circle class="hot" cx="0" cy="102" r="13"/><text x="-95" y="107" class="tiny">7  GPIO4 LAT</text>
    <circle class="unused" cx="220" cy="102" r="13"/><text x="240" y="107" class="tiny">8  GPIO14</text>
    <!-- row 5 -->
    <circle class="gnd" cx="0" cy="136" r="13"/><text x="-95" y="141" class="tiny">9  GND -> HUB75 16</text>
    <circle class="addr" cx="220" cy="136" r="13"/><text x="240" y="141" class="tiny">10 GPIO15 E</text>
    <!-- row 6 -->
    <circle class="hot" cx="0" cy="170" r="13"/><text x="-100" y="175" class="tiny">11 GPIO17 CLK</text>
    <circle class="hot" cx="220" cy="170" r="13"/><text x="240" y="175" class="tiny">12 GPIO18 OE</text>
    <!-- row 7 -->
    <circle class="g" cx="0" cy="204" r="13"/><text x="-95" y="209" class="tiny">13 GPIO27 G1</text>
    <circle class="gnd" cx="220" cy="204" r="13"/><text x="240" y="209" class="tiny">14 GND</text>
    <!-- row 8 -->
    <circle class="addr" cx="0" cy="238" r="13"/><text x="-90" y="243" class="tiny">15 GPIO22 A</text>
    <circle class="addr" cx="220" cy="238" r="13"/><text x="240" y="243" class="tiny">16 GPIO23 B</text>
    <!-- row 9 -->
    <circle class="unused" cx="0" cy="272" r="13"/><text x="-70" y="277" class="tiny">17 3V3</text>
    <circle class="addr" cx="220" cy="272" r="13"/><text x="240" y="277" class="tiny">18 GPIO24 C</text>
    <!-- row 10 -->
    <circle class="b" cx="0" cy="306" r="13"/><text x="-95" y="311" class="tiny">19 GPIO10 B2</text>
    <circle class="gnd" cx="220" cy="306" r="13"/><text x="240" y="311" class="tiny">20 GND</text>
    <!-- row 11 -->
    <circle class="g" cx="0" cy="340" r="13"/><text x="-90" y="345" class="tiny">21 GPIO9 G2</text>
    <circle class="addr" cx="220" cy="340" r="13"/><text x="240" y="345" class="tiny">22 GPIO25 D</text>
    <!-- row 12 -->
    <circle class="r" cx="0" cy="374" r="13"/><text x="-95" y="379" class="tiny">23 GPIO11 R1</text>
    <circle class="r" cx="220" cy="374" r="13"/><text x="240" y="379" class="tiny">24 GPIO8 R2</text>
    <!-- row 13 -->
    <circle class="gnd" cx="0" cy="408" r="13"/><text x="-70" y="413" class="tiny">25 GND</text>
    <circle class="b" cx="220" cy="408" r="13"/><text x="240" y="413" class="tiny">26 GPIO7 B1</text>
    <!-- row 14 -->
    <circle class="unused" cx="0" cy="442" r="13"/><text x="-78" y="447" class="tiny">27 GPIO0</text>
    <circle class="unused" cx="220" cy="442" r="13"/><text x="240" y="447" class="tiny">28 GPIO1</text>
    <!-- row 15 -->
    <circle class="unused" cx="0" cy="476" r="13"/><text x="-78" y="481" class="tiny">29 GPIO5</text>
    <circle class="gnd" cx="220" cy="476" r="13"/><text x="240" y="481" class="tiny">30 GND</text>
    <!-- row 16 -->
    <circle class="unused" cx="0" cy="510" r="13"/><text x="-78" y="515" class="tiny">31 GPIO6</text>
    <circle class="unused" cx="220" cy="510" r="13"/><text x="240" y="515" class="tiny">32 GPIO12</text>
    <!-- row 17 -->
    <circle class="unused" cx="0" cy="544" r="13"/><text x="-85" y="549" class="tiny">33 GPIO13</text>
    <circle class="gnd" cx="220" cy="544" r="13"/><text x="240" y="549" class="tiny">34 GND</text>
    <!-- row 18 -->
    <circle class="unused" cx="0" cy="578" r="13"/><text x="-85" y="583" class="tiny">35 GPIO19</text>
    <circle class="unused" cx="220" cy="578" r="13"/><text x="240" y="583" class="tiny">36 GPIO16</text>
    <!-- row 19 -->
    <circle class="unused" cx="0" cy="612" r="13"/><text x="-85" y="617" class="tiny">37 GPIO26</text>
    <circle class="unused" cx="220" cy="612" r="13"/><text x="240" y="617" class="tiny">38 GPIO20</text>
    <!-- row 20 -->
    <circle class="gnd" cx="0" cy="646" r="13"/><text x="-70" y="651" class="tiny">39 GND</text>
    <circle class="unused" cx="220" cy="646" r="13"/><text x="240" y="651" class="tiny">40 GPIO21</text>
  </g>

  <!-- HUB75 all pins. Coordinates: left x=1090, right x=1230, y=295+row*50 -->
  <g id="hub" transform="translate(1090,295)">
    <circle class="r" cx="0" cy="0" r="14"/><text x="-78" y="5" class="small">1 R1</text>
    <circle class="g" cx="140" cy="0" r="14"/><text x="162" y="5" class="small">2 G1</text>
    <circle class="b" cx="0" cy="50" r="14"/><text x="-78" y="55" class="small">3 B1</text>
    <circle class="gnd" cx="140" cy="50" r="14"/><text x="162" y="55" class="small">4 GND</text>
    <circle class="r" cx="0" cy="100" r="14"/><text x="-78" y="105" class="small">5 R2</text>
    <circle class="g" cx="140" cy="100" r="14"/><text x="162" y="105" class="small">6 G2</text>
    <circle class="b" cx="0" cy="150" r="14"/><text x="-78" y="155" class="small">7 B2</text>
    <circle class="addr" cx="140" cy="150" r="14"/><text x="162" y="155" class="small">8 E</text>
    <circle class="addr" cx="0" cy="200" r="14"/><text x="-78" y="205" class="small">9 A</text>
    <circle class="addr" cx="140" cy="200" r="14"/><text x="162" y="205" class="small">10 B</text>
    <circle class="addr" cx="0" cy="250" r="14"/><text x="-78" y="255" class="small">11 C</text>
    <circle class="addr" cx="140" cy="250" r="14"/><text x="162" y="255" class="small">12 D</text>
    <circle class="hot" cx="0" cy="300" r="14"/><text x="-78" y="305" class="small">13 CLK</text>
    <circle class="hot" cx="140" cy="300" r="14"/><text x="162" y="305" class="small">14 LAT</text>
    <circle class="hot" cx="0" cy="350" r="14"/><text x="-78" y="355" class="small">15 OE</text>
    <circle class="gnd" cx="140" cy="350" r="14"/><text x="162" y="355" class="small">16 GND</text>
  </g>

  <!-- Important checking wires -->
  <path class="wire orange" d="M110,440 C520,420 810,560 1090,595"/>
  <text x="620" y="405" class="small">CLK: Pi 11 / GPIO17 -> HUB75 13</text>
  <path class="wire orange" d="M110,372 C520,390 835,585 1230,595"/>
  <text x="620" y="432" class="small">LAT/STB: Pi 7 / GPIO4 -> HUB75 14</text>
  <path class="wire orange" d="M330,440 C570,455 825,620 1090,645"/>
  <text x="620" y="459" class="small">OE: Pi 12 / GPIO18 -> HUB75 15</text>

  <path class="wire gray" d="M330,338 C570,720 880,750 1230,345"/>
  <path class="wire gray" d="M110,406 C550,745 895,775 1230,645"/>
  <text x="620" y="486" class="small">GND: Pi 6 -> HUB75 4, Pi 9 -> HUB75 16</text>

  <path class="wire purple" d="M110,508 C555,510 860,485 1090,495"/>
  <path class="wire purple" d="M330,508 C570,525 880,505 1230,495"/>
  <path class="wire purple" d="M330,542 C580,555 880,535 1090,545"/>
  <path class="wire purple" d="M330,610 C585,595 885,565 1230,545"/>
  <path class="wire purple" d="M330,406 C585,430 890,455 1230,445"/>
  <text x="620" y="525" class="small">A/B/C/D/E: check for one-pin shift if pixels are random</text>

  <path class="wire red" d="M110,644 C610,640 850,270 1090,295"/>
  <path class="wire green" d="M110,474 C585,480 875,270 1230,295"/>
  <path class="wire blue" d="M330,678 C635,660 865,330 1090,345"/>
  <path class="wire red" d="M330,644 C630,625 875,370 1090,395"/>
  <path class="wire green" d="M110,610 C595,600 880,365 1230,395"/>
  <path class="wire blue" d="M110,576 C585,580 865,415 1090,445"/>
  <text x="620" y="565" class="small">RGB lines: R1/G1/B1 and R2/G2/B2. Bottom red -> check G2/B2/R2.</text>

  <rect x="620" y="610" width="720" height="210" class="box"/>
  <text x="645" y="645" class="label">Legend</text>
  <circle class="hot" cx="660" cy="680" r="11"/><text x="682" y="685" class="small">Control lines: CLK, LAT, OE. Bad/missing = random pixels.</text>
  <circle class="addr" cx="660" cy="715" r="11"/><text x="682" y="720" class="small">Address lines: A, B, C, D, E. Shifted = wrong rows / chaotic image.</text>
  <circle class="r" cx="660" cy="750" r="11"/><text x="682" y="755" class="small">Color lines R/G/B. Bottom half uses R2/G2/B2.</text>
  <circle class="gnd" cx="660" cy="785" r="11"/><text x="682" y="790" class="small">Ground. Missing/common ground issue = unstable/random pixels.</text>
</svg>
