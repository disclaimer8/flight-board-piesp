<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <style>
    .bg { fill: #ffffff; }
    .title { font: 700 30px Arial, sans-serif; fill: #111827; }
    .subtitle { font: 18px Arial, sans-serif; fill: #374151; }
    .label { font: 15px Arial, sans-serif; fill: #111827; }
    .small { font: 12px Arial, sans-serif; fill: #374151; }
    .tiny { font: 11px Arial, sans-serif; fill: #374151; }
    .pin { fill: #f9fafb; stroke: #111827; stroke-width: 1.5; }
    .used { fill: #fff7ed; stroke: #111827; stroke-width: 2; }
    .gnd { fill: #e5e7eb; stroke: #111827; stroke-width: 2; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 10; }
    .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
    .wire { fill: none; stroke-width: 3.5; opacity: 0.92; }
    .red { stroke: #dc2626; }
    .green { stroke: #16a34a; }
    .blue { stroke: #2563eb; }
    .addr { stroke: #7c3aed; }
    .ctrl { stroke: #0f766e; }
    .ground { stroke: #4b5563; stroke-dasharray: 7 5; }
    .stripe { fill: #dc2626; }
  </style>

  <rect class="bg" width="1400" height="980"/>
  <text x="48" y="48" class="title">Raspberry Pi Zero W → HUB75 direct wiring</text>
  <text x="48" y="78" class="subtitle">Use rpi-rgb-led-matrix hardware_mapping: "regular". Power OFF while wiring.</text>

  <rect x="42" y="112" width="410" height="750" class="box"/>
  <text x="70" y="148" class="label">Raspberry Pi 40-pin header</text>
  <text x="70" y="172" class="small">Physical pin numbers. Odd pins on left, even pins on right.</text>
  <circle cx="105" cy="214" r="10" fill="#ef4444"/>
  <text x="122" y="219" class="small">physical pin 1 marker</text>

  <rect x="960" y="170" width="360" height="500" class="box"/>
  <text x="988" y="206" class="label">HUB75 / HUB75E INPUT connector</text>
  <text x="988" y="230" class="small">2x8 IDC. Find pin 1 by arrow/triangle or red stripe.</text>
  <rect x="992" y="252" width="170" height="14" class="stripe"/>
  <text x="1172" y="264" class="small">red stripe / pin 1 side</text>

  <rect x="530" y="760" width="780" height="130" class="warn"/>
  <text x="555" y="794" class="label">Power warning</text>
  <text x="555" y="825" class="small">Panel 5V must come from a separate 5V power supply. Do NOT power the panel from Raspberry Pi 5V.</text>
  <text x="555" y="852" class="small">Connect panel PSU GND to Raspberry Pi GND. Use at least HUB75 pins 4 and 16 to Pi GND.</text>

  <!-- Raspberry Pi pins: x left/right, y = 210 + row*30 -->
  <g id="rpi-pins">
    <text x="92" y="198" class="tiny">odd</text><text x="248" y="198" class="tiny">even</text>
    <!-- rows 1..20 -->
    <g transform="translate(92,210)">
      <circle class="pin" cx="0" cy="0" r="10"/><text x="-35" y="5" class="tiny">1</text>
      <circle class="pin" cx="150" cy="0" r="10"/><text x="168" y="5" class="tiny">2</text>
      <circle class="pin" cx="0" cy="30" r="10"/><text x="-35" y="35" class="tiny">3</text>
      <circle class="pin" cx="150" cy="30" r="10"/><text x="168" y="35" class="tiny">4</text>
      <circle class="pin" cx="0" cy="60" r="10"/><text x="-35" y="65" class="tiny">5</text>
      <circle class="gnd" cx="150" cy="60" r="10"/><text x="168" y="65" class="tiny">6 GND</text>
      <circle class="used" cx="0" cy="90" r="10"/><text x="-72" y="95" class="tiny">7 GPIO4 LAT</text>
      <circle class="pin" cx="150" cy="90" r="10"/><text x="168" y="95" class="tiny">8</text>
      <circle class="gnd" cx="0" cy="120" r="10"/><text x="-72" y="125" class="tiny">9 GND</text>
      <circle class="used" cx="150" cy="120" r="10"/><text x="168" y="125" class="tiny">10 GPIO15 E</text>
      <circle class="used" cx="0" cy="150" r="10"/><text x="-82" y="155" class="tiny">11 GPIO17 CLK</text>
      <circle class="used" cx="150" cy="150" r="10"/><text x="168" y="155" class="tiny">12 GPIO18 OE</text>
      <circle class="used" cx="0" cy="180" r="10"/><text x="-82" y="185" class="tiny">13 GPIO27 G1</text>
      <circle class="gnd" cx="150" cy="180" r="10"/><text x="168" y="185" class="tiny">14 GND</text>
      <circle class="used" cx="0" cy="210" r="10"/><text x="-82" y="215" class="tiny">15 GPIO22 A</text>
      <circle class="used" cx="150" cy="210" r="10"/><text x="168" y="215" class="tiny">16 GPIO23 B</text>
      <circle class="pin" cx="0" cy="240" r="10"/><text x="-35" y="245" class="tiny">17</text>
      <circle class="used" cx="150" cy="240" r="10"/><text x="168" y="245" class="tiny">18 GPIO24 C</text>
      <circle class="used" cx="0" cy="270" r="10"/><text x="-82" y="275" class="tiny">19 GPIO10 B2</text>
      <circle class="gnd" cx="150" cy="270" r="10"/><text x="168" y="275" class="tiny">20 GND</text>
      <circle class="used" cx="0" cy="300" r="10"/><text x="-82" y="305" class="tiny">21 GPIO9 G2</text>
      <circle class="used" cx="150" cy="300" r="10"/><text x="168" y="305" class="tiny">22 GPIO25 D</text>
      <circle class="used" cx="0" cy="330" r="10"/><text x="-82" y="335" class="tiny">23 GPIO11 R1</text>
      <circle class="used" cx="150" cy="330" r="10"/><text x="168" y="335" class="tiny">24 GPIO8 R2</text>
      <circle class="gnd" cx="0" cy="360" r="10"/><text x="-72" y="365" class="tiny">25 GND</text>
      <circle class="used" cx="150" cy="360" r="10"/><text x="168" y="365" class="tiny">26 GPIO7 B1</text>
      <circle class="pin" cx="0" cy="390" r="10"/><text x="-35" y="395" class="tiny">27</text>
      <circle class="pin" cx="150" cy="390" r="10"/><text x="168" y="395" class="tiny">28</text>
      <circle class="pin" cx="0" cy="420" r="10"/><text x="-35" y="425" class="tiny">29</text>
      <circle class="gnd" cx="150" cy="420" r="10"/><text x="168" y="425" class="tiny">30 GND</text>
      <circle class="pin" cx="0" cy="450" r="10"/><text x="-35" y="455" class="tiny">31</text>
      <circle class="pin" cx="150" cy="450" r="10"/><text x="168" y="455" class="tiny">32</text>
      <circle class="pin" cx="0" cy="480" r="10"/><text x="-35" y="485" class="tiny">33</text>
      <circle class="gnd" cx="150" cy="480" r="10"/><text x="168" y="485" class="tiny">34 GND</text>
      <circle class="pin" cx="0" cy="510" r="10"/><text x="-35" y="515" class="tiny">35</text>
      <circle class="pin" cx="150" cy="510" r="10"/><text x="168" y="515" class="tiny">36</text>
      <circle class="pin" cx="0" cy="540" r="10"/><text x="-35" y="545" class="tiny">37</text>
      <circle class="pin" cx="150" cy="540" r="10"/><text x="168" y="545" class="tiny">38</text>
      <circle class="gnd" cx="0" cy="570" r="10"/><text x="-72" y="575" class="tiny">39 GND</text>
      <circle class="pin" cx="150" cy="570" r="10"/><text x="168" y="575" class="tiny">40</text>
    </g>
  </g>

  <!-- HUB75 pins -->
  <g id="hub75-pins" transform="translate(1025,295)">
    <text x="-8" y="-18" class="tiny">left col</text><text x="105" y="-18" class="tiny">right col</text>
    <circle class="used" cx="0" cy="0" r="12"/><text x="-80" y="5" class="tiny">1 R1</text>
    <circle class="used" cx="110" cy="0" r="12"/><text x="130" y="5" class="tiny">2 G1</text>
    <circle class="used" cx="0" cy="42" r="12"/><text x="-80" y="47" class="tiny">3 B1</text>
    <circle class="gnd" cx="110" cy="42" r="12"/><text x="130" y="47" class="tiny">4 GND</text>
    <circle class="used" cx="0" cy="84" r="12"/><text x="-80" y="89" class="tiny">5 R2</text>
    <circle class="used" cx="110" cy="84" r="12"/><text x="130" y="89" class="tiny">6 G2</text>
    <circle class="used" cx="0" cy="126" r="12"/><text x="-80" y="131" class="tiny">7 B2</text>
    <circle class="used" cx="110" cy="126" r="12"/><text x="130" y="131" class="tiny">8 E</text>
    <circle class="used" cx="0" cy="168" r="12"/><text x="-80" y="173" class="tiny">9 A</text>
    <circle class="used" cx="110" cy="168" r="12"/><text x="130" y="173" class="tiny">10 B</text>
    <circle class="used" cx="0" cy="210" r="12"/><text x="-80" y="215" class="tiny">11 C</text>
    <circle class="used" cx="110" cy="210" r="12"/><text x="130" y="215" class="tiny">12 D</text>
    <circle class="used" cx="0" cy="252" r="12"/><text x="-80" y="257" class="tiny">13 CLK</text>
    <circle class="used" cx="110" cy="252" r="12"/><text x="130" y="257" class="tiny">14 LAT</text>
    <circle class="used" cx="0" cy="294" r="12"/><text x="-80" y="299" class="tiny">15 OE</text>
    <circle class="gnd" cx="110" cy="294" r="12"/><text x="130" y="299" class="tiny">16 GND</text>
  </g>

  <!-- Wires from Raspberry physical pin coords to HUB75 coords -->
  <!-- Pi coords absolute: left col x 92, right col x 242, base y 210 + row*30 -->
  <!-- HUB coords absolute: left x 1025, right x 1135, base y 295 + row*42 -->
  <path class="wire red" d="M92,540 C430,500 700,280 1025,295"/><text x="545" y="300" class="small">R1: Pi pin 23 / GPIO11 → HUB75 pin 1</text>
  <path class="wire green" d="M92,390 C420,370 710,280 1135,295"/><text x="545" y="325" class="small">G1: Pi pin 13 / GPIO27 → HUB75 pin 2</text>
  <path class="wire blue" d="M242,570 C455,540 760,340 1025,337"/><text x="545" y="350" class="small">B1: Pi pin 26 / GPIO7 → HUB75 pin 3</text>

  <path class="wire red" d="M242,540 C465,510 790,370 1025,379"/><text x="545" y="394" class="small">R2: Pi pin 24 / GPIO8 → HUB75 pin 5</text>
  <path class="wire green" d="M92,510 C455,500 790,410 1135,379"/><text x="545" y="419" class="small">G2: Pi pin 21 / GPIO9 → HUB75 pin 6</text>
  <path class="wire blue" d="M92,480 C430,480 770,440 1025,421"/><text x="545" y="444" class="small">B2: Pi pin 19 / GPIO10 → HUB75 pin 7</text>

  <path class="wire addr" d="M92,420 C420,440 770,470 1025,463"/><text x="545" y="488" class="small">A: Pi pin 15 / GPIO22 → HUB75 pin 9</text>
  <path class="wire addr" d="M242,420 C455,455 790,490 1135,463"/><text x="545" y="513" class="small">B: Pi pin 16 / GPIO23 → HUB75 pin 10</text>
  <path class="wire addr" d="M242,450 C455,485 790,520 1025,505"/><text x="545" y="538" class="small">C: Pi pin 18 / GPIO24 → HUB75 pin 11</text>
  <path class="wire addr" d="M242,510 C455,530 790,555 1135,505"/><text x="545" y="563" class="small">D: Pi pin 22 / GPIO25 → HUB75 pin 12</text>
  <path class="wire addr" d="M242,330 C470,365 810,430 1135,421"/><text x="545" y="588" class="small">E: Pi pin 10 / GPIO15 → HUB75 pin 8 (64-row HUB75E)</text>

  <path class="wire ctrl" d="M92,360 C420,590 780,620 1025,547"/><text x="545" y="628" class="small">CLK: Pi pin 11 / GPIO17 → HUB75 pin 13</text>
  <path class="wire ctrl" d="M92,300 C430,610 790,650 1135,547"/><text x="545" y="653" class="small">LAT/STB: Pi pin 7 / GPIO4 → HUB75 pin 14</text>
  <path class="wire ctrl" d="M242,360 C455,630 790,675 1025,589"/><text x="545" y="678" class="small">OE: Pi pin 12 / GPIO18 → HUB75 pin 15</text>

  <path class="wire ground" d="M242,270 C500,700 820,710 1135,337"/><text x="545" y="718" class="small">GND: Pi pin 6 → HUB75 pin 4</text>
  <path class="wire ground" d="M92,330 C500,735 850,730 1135,589"/><text x="545" y="743" class="small">GND: Pi pin 9 → HUB75 pin 16</text>
</svg>
