# Flight board configuration. Copy to config.yaml and edit.

# Observer location (decimal degrees) — the board ranks aircraft by distance
# from here.
lat: 50.1100
lon: 8.6820

# Reception radius for the airplanes.live query, in kilometres. Converted to
# nautical miles for the API (rounded up).
distance_km: 50

# How often to re-poll the API (seconds). Be polite: airplanes.live asks for
# <= 1 request/second; 15 s is plenty for a board.
refresh_sec: 15

# Number of nearest aircraft to display.
top_n: 8

# Seconds between page rotations when there are more aircraft than fit on one
# screen (4 rows). Ignored with <= 4 aircraft.
rotate_sec: 8

# Data source base URL. Point at a mirror if you run one.
source_url: "https://api.airplanes.live"

# Fonts. A bare filename is looked up in the bundled fonts/ directory first,
# then treated as a filesystem path. Omit to use Pillow's built-in bitmap font.
# Bundled: tom-thumb.bdf (3x5), 4x6.bdf, 5x8.bdf.
font_main: "5x8.bdf"        # callsigns
font_compact: "tom-thumb.bdf"  # altitude / distance column

# Colors as [r, g, b] (0-255) or "#rrggbb".
colors:
  callsign: [255, 255, 255]  # white
  alt: [0, 180, 80]          # muted green
  dist: [255, 170, 0]        # amber
  error: [255, 0, 0]         # stale-data dot

# Draw a 1 px red corner dot when the last poll failed (data is stale).
error_indicator: true

# Frames per second for horizontal scrolling between fetches.
scroll_fps: 20

# HUB75 panel geometry. A single 64x128 panel = 64 rows, 128 cols.
panel:
  rows: 64
  cols: 128
  chain: 1
  parallel: 1
  # See rpi-rgb-led-matrix docs: "regular", "adafruit-hat",
  # "adafruit-hat-pwm" (Bonnet/HAT with the GPIO4<->GPIO18 solder bridge).
  hardware_mapping: "regular"

# Panel brightness, 0-100.
brightness: 60

# GPIO timing slowdown. Pi Zero (slow) usually wants 1-2; faster Pis need more.
gpio_slowdown: 2
