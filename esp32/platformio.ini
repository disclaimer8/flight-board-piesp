; Flight board — ESP32 + HUB75 64x128 firmware.
; Mirrors the Pi (Python) implementation in ../pi.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -DCORE_DEBUG_LEVEL=3
  ; Classic ESP-WROOM-32 has NO PSRAM. 24bpp won't fit; 6-bit color keeps the
  ; DMA buffer small enough to coexist with WiFi+TLS. Raise to 8 if you have
  ; headroom and want more color fidelity.
  -DPIXEL_COLOR_DEPTH_BITS=6
lib_deps =
  mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.11
  bblanchon/ArduinoJson @ ^7.0
  ; HUB75 driver renders through Adafruit_GFX — pull it (and its BusIO dep) in
  ; explicitly so the LDF doesn't miss the transitive include.
  adafruit/Adafruit GFX Library @ ^1.11
  adafruit/Adafruit BusIO @ ^1.16

; Host-side unit tests for the Arduino-free logic (haversine / ranking / radius).
; Only nearest.cpp is compiled here — main/source/layout pull in Arduino + the
; panel driver and cannot build natively.
[env:native]
platform = native
test_framework = unity
; Compile project src during tests, but only the Arduino-free nearest.cpp.
test_build_src = true
build_src_filter = -<*> +<nearest.cpp>
