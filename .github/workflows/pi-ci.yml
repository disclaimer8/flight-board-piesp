name: pi-ci

on:
  push:
    paths: ['pi/**', '.github/workflows/pi-ci.yml']
  pull_request:
    paths: ['pi/**', '.github/workflows/pi-ci.yml']

defaults:
  run:
    working-directory: pi

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install dependencies
        # rgbmatrix is hardware-only (built on the Pi via scripts/install.sh)
        # and is intentionally NOT installed here. Host tests use MockRenderer.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q
